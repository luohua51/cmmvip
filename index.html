<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · 橙猫猫会员系统</title>
  <style>
    :root {
      --orange-primary: #FF7A00;
      --orange-light: #FFF3E6;
      --orange-deep: #F97316;
      --bg-page: #0f0f17;
      --text-main: #1f2937;
      --text-sub: #6b7280;
      --text-light: #9ca3af;
      --border: #f0f0f0;
      --shadow: 0 8px 30px rgba(0,0,0,0.12);
      --radius: 1rem;
      --transition: all 0.3s cubic-bezier(.2,.8,.2,1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(1200px 600px at 80% -10%, rgba(255,122,0,0.18), transparent 60%),
                  radial-gradient(900px 500px at -10% 110%, rgba(99,102,241,0.18), transparent 55%),
                  var(--bg-page);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      -webkit-font-smoothing: antialiased;
    }

    .login-wrap {
      width: 100%;
      max-width: 24rem;
    }
    .login-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 1.5rem;
      padding: 2.4rem 2rem 2rem;
      box-shadow: var(--shadow);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      justify-content: center;
      margin-bottom: 0.4rem;
    }
    .brand img {
      width: 3rem; height: 3rem; border-radius: 0.7rem; object-fit: cover;
      border: 2px solid var(--orange-primary);
    }
    .brand-name {
      font-size: 1.6rem; font-weight: 800;
      background: linear-gradient(135deg,#FF7A00 0%, #F97316 60%, #FFB300 100%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .login-sub {
      text-align: center; color: rgba(255,255,255,0.6); font-size: 0.9rem;
      margin-bottom: 1.8rem;
    }

    .field { margin-bottom: 1rem; }
    .field label {
      display: block; font-size: 0.82rem; font-weight: 600;
      color: rgba(255,255,255,0.75); margin-bottom: 0.45rem;
    }
    .input-wrap { position: relative; }
    .field input {
      width: 100%;
      padding: 0.85rem 1rem 0.85rem 2.7rem;
      font-size: 0.95rem;
      color: #fff;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 0.7rem;
      outline: none;
      transition: var(--transition);
    }
    .field input::placeholder { color: rgba(255,255,255,0.4); }
    .field input:focus {
      border-color: var(--orange-primary);
      background: rgba(255,255,255,0.1);
      box-shadow: 0 0 0 3px rgba(255,122,0,0.18);
    }
    .field .icon {
      position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%);
      font-size: 1.05rem; color: var(--orange-primary); pointer-events: none;
    }

    .login-btn {
      width: 100%;
      margin-top: 0.6rem;
      padding: 0.9rem;
      font-size: 1rem; font-weight: 800;
      color: #fff;
      background: linear-gradient(135deg, #FF7A00, #F97316);
      border: none; border-radius: 0.7rem;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(255,122,0,0.35);
      transition: var(--transition);
    }
    .login-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(255,122,0,0.45); }
    .login-btn:active { transform: translateY(0); }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .msg {
      min-height: 1.2rem;
      margin-top: 0.9rem;
      font-size: 0.85rem;
      text-align: center;
      color: #ff8a8a;
    }
    .msg.ok { color: #4ade80; }

    .hint {
      margin-top: 1.6rem;
      padding: 0.85rem 1rem;
      font-size: 0.78rem; line-height: 1.7;
      color: rgba(255,255,255,0.55);
      background: rgba(255,255,255,0.04);
      border: 1px dashed rgba(255,255,255,0.14);
      border-radius: 0.7rem;
      text-align: center;
    }

    .footer-mini {
      text-align: center; margin-top: 1.4rem;
      font-size: 0.75rem; color: rgba(255,255,255,0.35);
    }
    .footer-mini span { color: var(--orange-primary); }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="brand">
        <img src="./logo.png" alt="橙猫猫电竞" onerror="this.style.display='none'" />
        <span class="brand-name">橙猫猫电竞</span>
      </div>
      <div class="login-sub">会员系统 · 登录</div>

      <form id="loginForm" autocomplete="off">
        <div class="field">
          <label for="username">账号（邮箱）</label>
          <div class="input-wrap">
            <span class="icon">📧</span>
            <input id="username" name="username" type="email" placeholder="请输入注册邮箱" required autocomplete="email" />
          </div>
        </div>
        <div class="field">
          <label for="password">密码</label>
          <div class="input-wrap">
            <span class="icon">🔒</span>
            <input id="password" name="password" type="password" placeholder="请输入密码" required autocomplete="current-password" />
          </div>
        </div>
        <button class="login-btn" id="loginBtn" type="submit">登 录</button>
        <div class="msg" id="msg"></div>
      </form>

      <div class="hint">
        🔒 账号由管理员统一开通，如有需要请联系客服
      </div>
    </div>
    <div class="footer-mini">© 2026 橙猫猫电竞 · <span>陪你赢到天明</span></div>
  </div>

  <script>
    // 已登录则直接跳转
    fetch("/api/session").then(r => r.json()).then(d => {
      if (d.ok && d.user) {
        const role = d.user.role || 'member';
        if (role === 'admin' || role === 'operator') {
          location.href = '/admin.html';
        } else {
          location.href = '/member.html';
        }
      }
    }).catch(() => {});

    const form = document.getElementById("loginForm");
    const btn = document.getElementById("loginBtn");
    const msg = document.getElementById("msg");

    function showMsg(text, ok) {
      msg.textContent = text;
      msg.className = "msg" + (ok ? " ok" : "");
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      if (!username || !password) { showMsg("请输入账号和密码"); return; }
      btn.disabled = true;
      btn.textContent = "登录中…";
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.ok) {
          showMsg("登录成功，正在跳转…", true);
          location.href = data.redirect || "/member.html";
        } else {
          showMsg(data.error || "登录失败");
        }
      } catch (err) {
        showMsg("网络错误，请稍后重试");
      } finally {
        btn.disabled = false;
        btn.textContent = "登 录";
      }
    });
  </script>
</body>
</html>
